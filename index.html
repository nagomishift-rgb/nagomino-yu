<!doctype html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f766e">
<title>なごみの湯クイズ検定 ～第1弾～</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<main class="app">
<section id="startScreen" class="card">
<div class="logo">なごみの湯</div>
<h1>クイズ検定<br><span>～第1弾～</span></h1>
<p class="lead">なごみの湯に関する4択クイズに挑戦！</p>
<p id="loginStatus" class="muted">LINE情報を確認しています…</p>
<button id="startBtn" class="primary" disabled>クイズを始める</button>
<p class="small">全10問・4択</p>
</section>

<section id="quizScreen" class="hidden">
<div class="topbar"><span id="progress"></span><span id="score"></span></div>
<div class="card">
<div class="questionNo" id="questionNo"></div>
<h2 id="questionText"></h2>
<div id="options" class="options"></div>
<button id="nextBtn" class="primary hidden">次の問題へ</button>
</div>
</section>

<section id="resultScreen" class="card hidden">
<div class="result-icon">FINISH</div>
<h1>クイズ終了！</h1>
<div class="resultScore"><span id="finalScore">0</span><small> / 10問 正解</small></div>
<p id="resultMessage"></p>
<button id="retryBtn" class="primary">もう一度挑戦</button>
<button id="closeBtn" class="secondary">閉じる</button>
</section>
<footer>天然温泉 なごみの湯</footer>
</main>
<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<script src="/config.js"></script>
<script src="/app.js"></script>
</body>
</html>
